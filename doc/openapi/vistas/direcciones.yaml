  /api/v1/users/{id}/addresses/{addressId}:
    put:
      tags:
      - Direcciones
      summary: Modificar dirección completa
      description: |-
        Sólo el titular ACTIVO. Reemplaza los datos editables de una dirección activa y propia. No modifica predeterminada.
        calle, numero, ciudad, provincia y codigoPostal son obligatorios. Omitir piso o departamento, o enviarlos null, elimina su valor anterior.
        Si addressId no existe, está inactivo o pertenece a otro usuario, devuelve el mismo 404 ADDRESS_NOT_FOUND.
        El intento de operar sobre un id de usuario ajeno devuelve 403 antes de consultar la dirección.
      operationId: modificarDireccion
      x-trazabilidad:
        api: API-07
        caso-de-uso: CU-05
        reglas:
