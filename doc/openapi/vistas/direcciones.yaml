    delete:
      tags:
      - Direcciones
      summary: Dar de baja lógica una dirección
      description: |-
        Sólo el titular ACTIVO. Conserva la dirección en persistencia como inactiva para mantener referencias históricas.
        Si era predeterminada, la desmarca sin elegir otra automáticamente. No recibe cuerpo ni devuelve cuerpo: 204 No Content.
        Una dirección inexistente, inactiva o ajena produce 404 ADDRESS_NOT_FOUND sin distinguir la causa.
        Repetir el DELETE devuelve 404 por estar inactiva; el efecto de la operación sigue siendo idempotente.
      operationId: eliminarDireccion
      x-trazabilidad:
        api: API-08
        caso-de-uso: CU-05
        reglas:
        - RN-04
        - RN-05
        - RN-07
