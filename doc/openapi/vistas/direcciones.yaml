        departamento:
          type: string
          maxLength: 10
          nullable: true
          description: Valor informado; null si no se especificó.
          example: B
        ciudad:
          type: string
          minLength: 1
          maxLength: 80
          pattern: \S
          example: Ciudad Autónoma de Buenos Aires
        provincia:
          type: string
          minLength: 1
          maxLength: 80
          pattern: \S
          example: Ciudad Autónoma de Buenos Aires
        codigoPostal:
          type: string
          minLength: 1
          maxLength: 10
          pattern: \S
          example: C1099AAZ
        predeterminada:
          type: boolean
          example: false
      x-dto-id: DTO-07
    ErrorResponse:
      type: object
      additionalProperties: false
      description: DTO-08. Error común de Controller, Service y Security. status coincide con el código HTTP. Nunca
        expone stack traces, SQL, tokens ni contraseñas.
      required:
      - timestamp
      - status
      - code
      - message
      - path
      - correlationId
      properties:
        timestamp:
          type: string
          format: date-time
          description: Fecha ISO-8601 con zona horaria; se usa UTC en los ejemplos (DC-04).
          example: '2026-10-30T15:00:00Z'
        status:
          type: integer
          minimum: 400
          maximum: 599
          example: 400
        code:
          type: string
          enum:
          - VALIDATION_ERROR
          - UNAUTHENTICATED
          - INVALID_CREDENTIALS
          - FORBIDDEN
          - USER_INACTIVE
          - USER_NOT_FOUND
          - ADDRESS_NOT_FOUND
          - EMAIL_ALREADY_REGISTERED
          - INVALID_RESET_TOKEN
          - INTERNAL_ERROR
          example: VALIDATION_ERROR
        message:
          type: string
          minLength: 1
          pattern: \S
          example: La solicitud contiene datos inválidos
        path:
          type: string
          pattern: ^/api/v1/
          example: /api/v1/auth/register
          description: Ruta concreta solicitada, sin query string, credenciales ni datos internos.
        correlationId:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9._-]+$
          example: g02-demo-001
          description: Reutiliza X-Correlation-Id válido o genera uno nuevo. Coincide con la cabecera de respuesta.
        details:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/DetalleValidacion'
          description: Sólo se incluye en VALIDATION_ERROR. Para errores generales de JSON se usa campo body; no
            incluye valores recibidos ni contraseñas.
      x-dto-id: DTO-08
    ModificarDireccionRequest:
      type: object
      additionalProperties: false
      description: DTO-09. PUT reemplaza los datos editables y conserva predeterminada. No admite id, usuarioId,
        activa, predeterminada ni referencia.
      required:
      - calle
      - numero
      - ciudad
      - provincia
      - codigoPostal
      properties:
        calle:
          type: string
          minLength: 1
          maxLength: 100
          pattern: \S
          example: Av. Independencia
        numero:
          type: string
          minLength: 1
          maxLength: 10
          pattern: \S
          example: '1200'
          description: 'Texto, no entero: admite numeración alfanumérica o S/N.'
        piso:
          type: string
          maxLength: 10
          nullable: true
          description: Opcional. Admite PB y otros valores alfanuméricos. En PUT, omitir o enviar null elimina el
            valor anterior.
          example: '2'
        departamento:
          type: string
          maxLength: 10
          nullable: true
          description: Opcional. En PUT, omitir o enviar null elimina el valor anterior.
          example: B
        ciudad:
          type: string
          minLength: 1
          maxLength: 80
          pattern: \S
          example: Ciudad Autónoma de Buenos Aires
        provincia:
          type: string
          minLength: 1
          maxLength: 80
          pattern: \S
          example: Ciudad Autónoma de Buenos Aires
        codigoPostal:
          type: string
