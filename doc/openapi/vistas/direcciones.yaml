        No incluye direcciones dadas de baja. Puede haber cero o una predeterminada, nunca más de una.
      operationId: listarDirecciones
      x-trazabilidad:
        api: API-05
        caso-de-uso: CU-05
        reglas:
        - RN-04
        - RN-05
        - RN-09
