components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT de usuario emitido por POST /api/v1/auth/login (o renovado con /api/v1/auth/refresh). En
        Swagger UI pegar sólo el token. sub contiene el id del usuario como texto; role su rol; exp el vencimiento.
        Validar firma, vencimiento, titularidad y estado en backend. No es una credencial de módulo.
    moduleApiKey:
      type: apiKey
      in: header
      name: X-Api-Key
      description: 'Credencial propia de un módulo consumidor (Pedidos, Logística, Catálogo, Notificaciones, Pagos,
        Opiniones y Analítica), entregada por el equipo de Usuarios y enviada servidor a servidor. Sólo permite
        leer: API-03, API-05 (únicamente Pedidos) y API-16. Se configura por variable de entorno; una clave vacía
        o de menos de 16 caracteres deja al módulo sin acceso. Si la solicitud trae también Authorization, manda
        el JWT. No es una credencial de usuario.'
  parameters:
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      description: Identificador de correlación. Se reutiliza el recibido si es válido; en su ausencia se genera
        uno. Si la cabecera es inválida, la respuesta 400 usa uno nuevo (DC-06).
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: ^[A-Za-z0-9._-]+$
        example: g02-demo-001
        description: Reutiliza X-Correlation-Id válido o genera uno nuevo. Coincide con la cabecera de respuesta.
    UsuarioId:
      name: id
      in: path
      required: true
      description: Identificador Long positivo del usuario. En llamadas de usuario debe coincidir con sub del JWT.
      schema:
        type: integer
        format: int64
        minimum: 1
        maximum: 9223372036854775807
        example: 1
    DireccionId:
      name: addressId
      in: path
      required: true
      description: Identificador Long positivo de una dirección activa del usuario indicado en id.
      schema:
        type: integer
        format: int64
        minimum: 1
        maximum: 9223372036854775807
        example: 10
  headers:
    CorrelationId:
      description: Identificador de correlación. Se reutiliza el recibido si es válido; en su ausencia se genera
        uno. Si la cabecera es inválida, la respuesta 400 usa uno nuevo (DC-06).
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: ^[A-Za-z0-9._-]+$
        example: g02-demo-001
        description: Reutiliza X-Correlation-Id válido o genera uno nuevo. Coincide con la cabecera de respuesta.
    Authenticate:
      description: Desafío de autenticación Bearer. En el login indica el esquema del recurso de autenticación;
        la API no usa HTTP Basic.
      schema:
        type: string
        example: Bearer realm="deliverygo-usuarios"
    NoStore:
      description: Impide almacenar datos de sesión y perfil en cachés compartidas.
      schema:
        type: string
        enum:
        - no-store
        example: no-store
  schemas:
    RegistrarUsuarioRequest:
      type: object
      additionalProperties: false
      description: DTO-01. No admite id, rol, estado, fechaAlta ni passwordHash. El servidor asigna identidad, rol
        CLIENTE y estado ACTIVO.
      required:
      - nombre
      - apellido
      - email
      - password
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 80
          pattern: \S
          example: Ana
        apellido:
          type: string
          minLength: 1
          maxLength: 80
          pattern: \S
          example: Pérez
        email:
          type: string
          minLength: 1
          maxLength: 120
          pattern: \S
          example: ana.perez@example.com
          format: email
          description: Email válido. Se recortan espacios exteriores y se normaliza a minúsculas antes de comparar
            o persistir (DC-02).
        telefono:
          type: string
          maxLength: 30
          nullable: true
          description: Opcional. Ausente, null o en blanco significa sin teléfono; en PUT elimina el valor anterior
            (DC-03).
          example: +54 11 5555 0101
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 8
          pattern: \S
          description: 'Mínimo 8 caracteres (RN-01). No recortar ni normalizar. Nunca se devuelve ni se registra
            en logs. Máximo 72 bytes en UTF-8: es el límite de BCrypt y el servidor lo rechaza con 400.'
          example: ClaveDemo2026!
      x-dto-id: DTO-01
    UsuarioResponse:
      type: object
      additionalProperties: false
      description: DTO-02. Perfil sin contraseña ni hash. No incluye direcciones; se consultan mediante API-05.
        Los campos opcionales sin valor se devuelven como null (DC-03).
      required:
      - id
      - nombre
      - apellido
      - email
      - telefono
      - rol
      - estado
      - fechaAlta
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          maximum: 9223372036854775807
          example: 1
          readOnly: true
        nombre:
          type: string
          minLength: 1
          maxLength: 80
          pattern: \S
          example: Ana
        apellido:
          type: string
          minLength: 1
          maxLength: 80
          pattern: \S
          example: Pérez
        email:
          type: string
          minLength: 1
          maxLength: 120
          pattern: \S
          example: ana.perez@example.com
          format: email
          description: Email válido. Se recortan espacios exteriores y se normaliza a minúsculas antes de comparar
            o persistir (DC-02).
        telefono:
          type: string
          maxLength: 30
          nullable: true
          description: Teléfono de contacto; null si no se informó.
          example: +54 11 5555 0101
        rol:
          $ref: '#/components/schemas/Rol'
        estado:
          $ref: '#/components/schemas/EstadoUsuario'
        fechaAlta:
          type: string
          format: date-time
          description: Fecha ISO-8601 con zona horaria; se usa UTC en los ejemplos (DC-04).
          example: '2026-10-30T15:00:00Z'
          readOnly: true
      x-dto-id: DTO-02
    LoginRequest:
      type: object
      additionalProperties: false
      description: DTO-03. Autenticación por email y contraseña; no utiliza username.
      required:
      - email
      - password
      properties:
        email:
          type: string
          minLength: 1
          maxLength: 120
          pattern: \S
          example: ana.perez@example.com
          format: email
          description: Email válido. Se recortan espacios exteriores y se normaliza a minúsculas antes de comparar
            o persistir (DC-02).
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 1
          pattern: \S
          description: Obligatoria y no vacía. Se verifica sin recortar ni normalizar; la política de alta no se
            reaplica al login (DC-05).
          example: ClaveDemo2026!
      x-dto-id: DTO-03
    LoginResponse:
      type: object
      additionalProperties: false
      description: DTO-04. Token y datos mínimos para el Portal. La firma asimétrica es el objetivo de integración
        de la teoría; la distribución de claves debe acordarse. El token de ejemplo no es utilizable.
      required:
      - token
      - tipo
      - expiraEn
      - usuarioId
      - nombre
      - rol
      properties:
        token:
          type: string
          minLength: 1
          description: JWT firmado. El ejemplo tiene firma ficticia y no permite autenticarse.
          example: eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxIiwicm9sZSI6IkNMSUVOVEUiLCJpYXQiOjE3OTMzNzI0MDAsImV4cCI6MTc5MzM3NjAwMH0.FIRMA_DE_EJEMPLO_NO_VALIDA
        tipo:
          type: string
          enum:
          - Bearer
          example: Bearer
        expiraEn:
          type: string
          format: date-time
          description: Vencimiento absoluto del JWT. Debe corresponder al claim exp; no es una duración en segundos.
          example: '2026-10-30T16:00:00Z'
        usuarioId:
          type: integer
          format: int64
          minimum: 1
          maximum: 9223372036854775807
          example: 1
        nombre:
          type: string
          minLength: 1
          maxLength: 80
          pattern: \S
          example: Ana
        rol:
          $ref: '#/components/schemas/Rol'
      x-dto-id: DTO-04
    ModificarPerfilRequest:
      type: object
      additionalProperties: false
      description: DTO-05. PUT reemplaza todos los datos editables; telefono ausente/null/en blanco borra el anterior.
        No admite rol, estado ni password (RN-10).
      required:
      - nombre
      - apellido
      - email
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 80
          pattern: \S
          example: Ana
        apellido:
          type: string
          minLength: 1
          maxLength: 80
          pattern: \S
          example: Pérez
        email:
          type: string
          minLength: 1
          maxLength: 120
          pattern: \S
          example: ana.perez@example.com
          format: email
