# Backend de Usuarios en un contenedor (clase 13). La base es H2 en memoria dentro del mismo proceso, así que no
# hay contenedor de base de datos y los datos se pierden al detener el contenedor:
#   docker compose -f compose.backend.yaml up -d --build
#   docker compose -f compose.backend.yaml logs -f backend
#   docker compose -f compose.backend.yaml down
# Si Usuarios corre localmente con mvn spring-boot:run, detenerlo antes: ambos usan el puerto 8089.
services:
  backend:
    build: .
    image: deliverygo-usuarios:latest
    container_name: deliverygo-usuarios-api
    ports:
      - "8089:8089"
    environment:
      JWT_SECRET: ${JWT_SECRET:-desarrollo-local-no-usar-en-produccion-0123456789}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:5174}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
