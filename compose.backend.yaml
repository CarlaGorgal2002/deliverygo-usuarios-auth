# Backend de Usuarios dentro de la red interna de Compose (clase 13). Se combina con docker-compose.yml, que define
# PostgreSQL:
#   docker compose -f docker-compose.yml -f compose.backend.yaml up -d --build
#   docker compose -f docker-compose.yml -f compose.backend.yaml logs -f backend
#   docker compose -f docker-compose.yml -f compose.backend.yaml down      (conserva los datos; "down -v" los borra)
# Dentro de la red, el backend llega a la base por el nombre del servicio (postgres), no por localhost.
# Si Usuarios corre localmente con mvn spring-boot:run, detenerlo antes: ambos usan el puerto 8089.
services:
  backend:
    build: .
    image: deliverygo-usuarios:latest
    container_name: deliverygo-usuarios-api
    ports:
      - "8089:8089"
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-deliverygo_usuarios}
      DB_USERNAME: ${DB_USERNAME:-deliverygo}
      DB_PASSWORD: ${DB_PASSWORD:-deliverygo}
      JWT_SECRET: ${JWT_SECRET:-desarrollo-local-no-usar-en-produccion-0123456789}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:5174}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      MODULE_KEY_PEDIDOS: ${MODULE_KEY_PEDIDOS:-}
      MODULE_KEY_LOGISTICA: ${MODULE_KEY_LOGISTICA:-}
      MODULE_KEY_CATALOGO: ${MODULE_KEY_CATALOGO:-}
      MODULE_KEY_NOTIFICACIONES: ${MODULE_KEY_NOTIFICACIONES:-}
      MODULE_KEY_PAGOS: ${MODULE_KEY_PAGOS:-}
      MODULE_KEY_OPINIONES_ANALITICA: ${MODULE_KEY_OPINIONES_ANALITICA:-}
    depends_on:
      postgres:
        condition: service_healthy
