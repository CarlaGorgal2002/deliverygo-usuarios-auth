spring.application.name=deliverygo-usuarios
server.port=8089

# Base propia del módulo: H2 en memoria. Arranca vacía en cada inicio: Hibernate crea las tablas y la
# aplicación carga los roles y el administrador inicial. Los datos se pierden al detener el servicio.
spring.datasource.url=jdbc:h2:mem:deliverygo_usuarios;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jmx.enabled=false
spring.application.admin.enabled=false
logging.level.org.hibernate.SQL=DEBUG
# El correlationId de cada solicitud aparece en todas las líneas del log (ApiRequestFilter).
logging.pattern.level=%5p [%X{correlationId:-}]

springdoc.swagger-ui.path=/swagger-ui.html

# El secreto sale de la variable de entorno JWT_SECRET. El valor por defecto es sólo para desarrollo
# local y NO debe usarse en ningún ambiente compartido. Mínimo 32 caracteres.
app.jwt.secret=${JWT_SECRET:desarrollo-local-no-usar-en-produccion-0123456789}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}

# Orígenes del Portal autorizados por CORS (separados por coma).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}

# CU-08: vigencia del token de recuperación de contraseña, en minutos.
app.recovery.token-minutes=${RECOVERY_TOKEN_MINUTES:30}
# Sólo para demostrar CU-08 en local: el mock de Notificaciones escribe el token en el log. NO activar en ambientes compartidos.
app.notificaciones.mock.log-recovery-token=${MOCK_LOG_RECOVERY_TOKEN:false}

# INT-01 / INT-06: cliente de Notificaciones. mock (por defecto) sólo escribe en el log; http llama a la API real.
app.notificaciones.modo=${NOTIFICACIONES_MODO:mock}
# Notificaciones usa por defecto el 8089, igual que server.port: en modo http levantar Usuarios en otro puerto
# (SERVER_PORT=8080). Si la URL apunta a este mismo servicio, la app no arranca.
app.notificaciones.base-url=${NOTIFICACIONES_URL:http://localhost:8089}
app.notificaciones.timeout-ms=${NOTIFICACIONES_TIMEOUT_MS:2000}
app.notificaciones.plantillas.bienvenida=${NOTIFICACIONES_PLANTILLA_BIENVENIDA:USUARIO_BIENVENIDA_EMAIL}
app.notificaciones.plantillas.recuperacion=${NOTIFICACIONES_PLANTILLA_RECUPERACION:RECUPERACION_PASSWORD_EMAIL}

# DM-07: primer administrador (ADMIN_EMAIL y ADMIN_PASSWORD juntos). Sin ellos no se crea ninguno.
app.bootstrap-admin.email=${ADMIN_EMAIL:}
app.bootstrap-admin.password=${ADMIN_PASSWORD:}

