spring.application.name=deliverygo-usuarios
server.port=8089

# Base propia del módulo. H2 en memoria sólo para desarrollo: los datos se pierden al reiniciar.
spring.datasource.url=jdbc:h2:mem:deliverygo-usuarios
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jmx.enabled=false
spring.application.admin.enabled=false
logging.level.org.hibernate.SQL=DEBUG
# El correlationId de cada solicitud aparece en todas las líneas del log (ApiRequestFilter).
logging.pattern.level=%5p [%X{correlationId:-}]

# DC-01: los DTO de entrada rechazan propiedades desconocidas (los tipos estrictos están en JacksonConfig).
spring.jackson.deserialization.fail-on-unknown-properties=true

springdoc.swagger-ui.path=/swagger-ui.html

# El secreto sale de la variable de entorno JWT_SECRET. El valor por defecto es sólo para desarrollo
# local y NO debe usarse en ningún ambiente compartido. Mínimo 32 caracteres.
app.jwt.secret=${JWT_SECRET:desarrollo-local-no-usar-en-produccion-0123456789}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}

# Orígenes del Portal autorizados por CORS (separados por coma).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}

# CU-08: vigencia del token de recuperación de contraseña, en minutos.
app.recovery.token-minutes=${RECOVERY_TOKEN_MINUTES:30}
# Sólo para demostrar CU-08 en local: el mock de Notificaciones escribe el token en el log. NO activar en ambientes compartidos.
app.notificaciones.mock.log-recovery-token=${MOCK_LOG_RECOVERY_TOKEN:false}

# DM-07: primer administrador (ADMIN_EMAIL y ADMIN_PASSWORD juntos). Sin ellos no se crea ninguno.
app.bootstrap-admin.email=${ADMIN_EMAIL:}
app.bootstrap-admin.password=${ADMIN_PASSWORD:}

# CU-10 / RN-15: API Key de cada módulo consumidor. Vacía o de menos de 16 caracteres = el módulo no tiene acceso.
app.modules.api-keys.pedidos=${MODULE_KEY_PEDIDOS:}
app.modules.api-keys.logistica=${MODULE_KEY_LOGISTICA:}
app.modules.api-keys.catalogo=${MODULE_KEY_CATALOGO:}
app.modules.api-keys.notificaciones=${MODULE_KEY_NOTIFICACIONES:}
app.modules.api-keys.pagos=${MODULE_KEY_PAGOS:}
app.modules.api-keys.opiniones-analitica=${MODULE_KEY_OPINIONES_ANALITICA:}
