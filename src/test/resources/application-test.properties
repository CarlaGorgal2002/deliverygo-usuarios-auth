# Perfil de las pruebas automáticas (@ActiveProfiles("test") en ApiTestSupport): una base H2 en memoria propia,
# separada de la de la aplicación. Cada contexto de prueba arranca con la base vacía.
spring.datasource.url=jdbc:h2:mem:deliverygo-usuarios-test
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
# Las pruebas crean sus propios usuarios: no se carga el usuario de prueba de las demos.
app.demo-user.enabled=false
