        estado:
          $ref: '#/components/schemas/EstadoUsuario'
        expiraEn:
          type: string
          format: date-time
          example: '2026-10-30T16:00:00Z'
          description: Vencimiento del token presentado (claim exp).
      x-dto-id: DTO-14
    SolicitarRecuperacionRequest:
      type: object
      additionalProperties: false
      description: DTO-12 (CU-08). Email de la cuenta. La respuesta no revela si existe (RN-13).
