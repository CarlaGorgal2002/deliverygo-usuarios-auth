# GENERADO: editar deliverygo-usuarios.yaml y ejecutar exportar_vistas.py.
openapi: 3.0.3
info:
  title: DeliveryGo - Usuarios y Autenticación - Grupo 02 - Autenticación
  version: 1.1.0
  description: |-
    Vista generada por área. Es parte del mismo servicio, no un microservicio independiente. El contrato completo y editable es deliverygo-usuarios.yaml.

    Contrato de los diez casos de uso del módulo: los cinco CORE (CU-01 a CU-05, API-01 a API-09) y los cinco de evolución
    (CU-06 a CU-10, API-10 a API-16), con dieciséis operaciones.
    Basado en G02_Usuarios_PrimeraEntrega_v1.5.pdf, consigna, guía funcional, teoría, publicaciones y clases, hasta el material adjunto.
    Grupo académico 02; módulo Usuarios, identificado como Equipo 1 en la guía general.

    Contrato de entrega del 30/10/2026, versión 1.1.0. El backend del repositorio implementa las dieciséis operaciones y las verifican
    las pruebas de integración (VERIFICACION.md). El diseño de CU-06 a CU-10 está en DISENO_CU_EVOLUCION.md.
    Los acuerdos pendientes con otros módulos se describen en ACUERDOS_Y_BRECHAS.md.

    Convenciones: rutas /api/v1; JSON UTF-8; IDs Long positivos; DTO separados de entidades; fechas ISO-8601 con zona;
    errores normalizados; PUT completo; baja lógica con 204 sin cuerpo. Datos de ejemplo ficticios.
    Hay dos credenciales: el JWT de usuario (Bearer) y la API Key de módulo consumidor (X-Api-Key, sólo lectura). Ninguna se sustituye por
    roles humanos privilegiados: un ADMIN no es un módulo. Usuarios emite el JWT; cada servicio valida firma, vencimiento y permisos.
    El objetivo de firma es asimétrico, conforme a la teoría. No se distribuyen claves privadas en el contrato.

    Decisiones que completan ambigüedades de la primera entrega: DC-01 campos desconocidos rechazados;
    DC-02 normalización de email; DC-03 ausencia/null de opcionales y reemplazo PUT;
    DC-04 zona horaria; DC-05 validación de login; DC-06 correlación; DC-07 errores de ruta y usuario inexistente;
    DC-08 credencial de módulo por API Key; DC-09 recuperación de contraseña uniforme y de un solo uso;
    DC-10 rol y estado vigentes consultables, con JWT sin estado y sin revocación.
    Se documentan como decisiones del equipo, no como nuevas instrucciones del profesor.
  contact:
    name: Grupo 02 - Usuarios y Autenticación
servers:
- url: http://localhost:8089
  description: Puerto de desarrollo configurado en el repositorio.
- url: '{scheme}://{host}:{port}'
  description: Integración; reemplazar host y puerto por los acordados. No representa un despliegue existente.
  variables:
    scheme:
      default: http
      enum:
      - http
      - https
      description: HTTP sólo para laboratorio controlado; HTTPS para entornos expuestos.
    host:
      default: localhost
      description: Host del módulo Usuarios, pendiente de asignación.
    port:
      default: '8089'
      description: Puerto del módulo Usuarios.
tags:
- name: Autenticación
  description: CU-01, CU-02, CU-08 y CU-09. Registro, emisión y renovación de JWT, y recuperación de contraseña.
security:
- bearerAuth: []
paths:
  /api/v1/auth/register:
    post:
      tags:
      - Autenticación
      summary: Registrar usuario
      description: |-
        Crea un usuario con rol CLIENTE, estado ACTIVO y email único. La contraseña se almacena mediante hash irreversible.
        No se emite JWT: luego debe ejecutarse el login. La unicidad del email también debe garantizarse ante concurrencia.
        La bienvenida INT-01 es no bloqueante: un fallo de Notificaciones no revierte el registro ni cambia el 201.
        INT-01 permanece como mock declarado hasta disponer del contrato del equipo de Notificaciones.
      operationId: registrarUsuario
      x-trazabilidad:
        api: API-01
        caso-de-uso: CU-01
        reglas:
        - RN-01
        - RN-02
        - RN-03
        - RN-06
        secuencia: SEC-01
        servicio: SRV-01
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      responses:
        '201':
          description: 'Registrar usuario: operación completada.'
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Location:
              description: URI del recurso creado. Para recuperar direcciones se utiliza el listado API-05.
              schema:
                type: string
                format: uri-reference
                example: /api/v1/users/1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioResponse'
              examples:
                usuarioCreado:
                  value:
                    id: 1
                    nombre: Ana
                    apellido: Pérez
                    email: ana.perez@example.com
                    telefono: +54 11 5555 0101
                    rol: CLIENTE
                    estado: ACTIVO
                    fechaAlta: '2026-10-30T15:00:00Z'
        '400':
          description: 'VALIDATION_ERROR: La solicitud contiene datos inválidos.'
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                VALIDATION_ERROR:
                  value:
                    timestamp: '2026-10-30T15:00:00Z'
                    status: 400
                    code: VALIDATION_ERROR
                    message: La solicitud contiene datos inválidos
                    path: /api/v1/auth/register
                    correlationId: g02-demo-001
                    details:
                    - campo: body
                      mensaje: El cuerpo debe ser JSON válido
        '409':
          description: 'EMAIL_ALREADY_REGISTERED: El email ya está registrado.'
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                EMAIL_ALREADY_REGISTERED:
                  value:
                    timestamp: '2026-10-30T15:00:00Z'
                    status: 409
                    code: EMAIL_ALREADY_REGISTERED
                    message: El email ya está registrado
                    path: /api/v1/auth/register
                    correlationId: g02-demo-001
        '500':
          description: 'INTERNAL_ERROR: Ocurrió un error interno.'
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                INTERNAL_ERROR:
                  value:
                    timestamp: '2026-10-30T15:00:00Z'
                    status: 500
                    code: INTERNAL_ERROR
                    message: Ocurrió un error interno
                    path: /api/v1/auth/register
                    correlationId: g02-demo-001
      security: []
      requestBody:
        required: true
        description: Objeto JSON conforme al DTO; campos desconocidos se rechazan con 400 VALIDATION_ERROR (DC-01).
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrarUsuarioRequest'
            examples:
              conTelefono:
                value:
                  nombre: Ana
                  apellido: Pérez
                  email: ana.perez@example.com
                  telefono: +54 11 5555 0101
                  password: ClaveDemo2026!
              sinTelefono:
                value:
                  nombre: Ana
                  apellido: Pérez
                  email: ana.perez@example.com
                  password: ClaveDemo2026!
      x-estado-implementacion: Implementada; verificada con pruebas de integración (ver VERIFICACION.md)
  /api/v1/auth/login:
    post:
      tags:
      - Autenticación
      summary: Iniciar sesión
      description: |-
        Autentica mediante email y password. Email inexistente y contraseña incorrecta producen el mismo 401 INVALID_CREDENTIALS.
        Sólo después de verificar la contraseña se comprueba el estado; una cuenta INACTIVA devuelve 403 USER_INACTIVE.
        El JWT identifica al usuario con sub (id convertido a texto), role y exp; iat registra su emisión.
        El Portal adjunta Authorization: Bearer <token>. Cada backend valida firma, vencimiento y permisos; decodificar en React no autoriza.
        expiraEn es una fecha absoluta, no expiresInSeconds. La vigencia es configurable; una hora es sólo el ejemplo.
        Esta operación es pública aun si el navegador conserva un token viejo.
      operationId: iniciarSesion
      x-trazabilidad:
        api: API-02
        caso-de-uso: CU-02
        reglas:
        - RN-01
        - RN-03
        - RN-04
        - RN-08
        - RN-09
        secuencia: SEC-02
        servicio: SRV-02
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: 'Iniciar sesión: operación completada.'
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              examples:
                sesion:
                  value:
                    token: eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxIiwicm9sZSI6IkNMSUVOVEUiLCJpYXQiOjE3OTMzNzI0MDAsImV4cCI6MTc5MzM3NjAwMH0.FIRMA_DE_EJEMPLO_NO_VALIDA
                    tipo: Bearer
                    expiraEn: '2026-10-30T16:00:00Z'
                    usuarioId: 1
                    nombre: Ana
                    rol: CLIENTE
        '400':
          description: 'VALIDATION_ERROR: La solicitud contiene datos inválidos.'
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                VALIDATION_ERROR:
                  value:
                    timestamp: '2026-10-30T15:00:00Z'
                    status: 400
                    code: VALIDATION_ERROR
                    message: La solicitud contiene datos inválidos
                    path: /api/v1/auth/login
                    correlationId: g02-demo-001
                    details:
                    - campo: body
                      mensaje: El cuerpo debe ser JSON válido
        '401':
          description: 'INVALID_CREDENTIALS: Email o contraseña incorrectos.'
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            WWW-Authenticate:
              $ref: '#/components/headers/Authenticate'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                INVALID_CREDENTIALS:
                  value:
                    timestamp: '2026-10-30T15:00:00Z'
                    status: 401
                    code: INVALID_CREDENTIALS
                    message: Email o contraseña incorrectos
                    path: /api/v1/auth/login
                    correlationId: g02-demo-001
        '403':
          description: 'USER_INACTIVE: La cuenta está inactiva.'
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                USER_INACTIVE:
                  value:
                    timestamp: '2026-10-30T15:00:00Z'
                    status: 403
                    code: USER_INACTIVE
                    message: La cuenta está inactiva
                    path: /api/v1/auth/login
                    correlationId: g02-demo-001
        '500':
          description: 'INTERNAL_ERROR: Ocurrió un error interno.'
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                INTERNAL_ERROR:
                  value:
                    timestamp: '2026-10-30T15:00:00Z'
                    status: 500
                    code: INTERNAL_ERROR
                    message: Ocurrió un error interno
                    path: /api/v1/auth/login
                    correlationId: g02-demo-001
      security: []
      requestBody:
        required: true
        description: Objeto JSON conforme al DTO; campos desconocidos se rechazan con 400 VALIDATION_ERROR (DC-01).
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              credenciales:
                value:
                  email: ana.perez@example.com
                  password: ClaveDemo2026!
      x-estado-implementacion: Implementada; verificada con pruebas de integración (ver VERIFICACION.md)
  /api/v1/auth/password/forgot:
    post:
      tags:
      - Autenticación
      summary: Solicitar recuperación de contraseña
      description: 'Pide a Notificaciones que envíe al email de la cuenta un token de un solo uso (30 minutos por
        defecto). Responde siempre 202, exista o no la cuenta y esté o no activa, para no revelar qué emails están
        registrados (RN-13, DC-09). Un pedido nuevo deja sin efecto el token anterior. Sólo se guarda el hash del
        token. El envío (INT-06) es no bloqueante y hoy es un mock declarado: si falla, la respuesta no cambia.
        Operación pública aun si el navegador conserva un token viejo.'
      operationId: solicitarRecuperacionPassword
      x-trazabilidad:
        api: API-12
        caso-de-uso: CU-08
        reglas:
        - RN-01
        - RN-13
        secuencia: SEC-08
        servicio: SRV-12
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      responses:
        '202':
          description: Solicitud recibida; sin cuerpo. La respuesta es idéntica para cuentas existentes e inexistentes.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
        '400':
          description: 'VALIDATION_ERROR: La solicitud contiene datos inválidos.'
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                VALIDATION_ERROR:
                  value:
                    timestamp: '2026-10-30T15:00:00Z'
                    status: 400
                    code: VALIDATION_ERROR
                    message: La solicitud contiene datos inválidos
                    path: /api/v1/auth/password/forgot
                    correlationId: g02-demo-001
                    details:
                    - campo: email
                      mensaje: Debe tener un formato de email válido
        '500':
          description: 'INTERNAL_ERROR: Ocurrió un error interno.'
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                INTERNAL_ERROR:
                  value:
                    timestamp: '2026-10-30T15:00:00Z'
                    status: 500
                    code: INTERNAL_ERROR
                    message: Ocurrió un error interno
                    path: /api/v1/auth/password/forgot
                    correlationId: g02-demo-001
      security: []
      requestBody:
        required: true
        description: Objeto JSON conforme al DTO; campos desconocidos se rechazan con 400 VALIDATION_ERROR (DC-01).
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolicitarRecuperacionRequest'
            examples:
              solicitud:
                value:
                  email: ana.perez@example.com
      x-estado-implementacion: Implementada; verificada con pruebas de integración (ver VERIFICACION.md)
  /api/v1/auth/password/reset:
    post:
      tags:
      - Autenticación
      summary: Restablecer contraseña
      description: 'Cambia la contraseña con el token recibido por Notificaciones. El token se consume una sola
        vez, incluso ante pedidos simultáneos. Token inexistente, vencido, ya usado o de una cuenta inactiva dan
        el mismo 400 INVALID_RESET_TOKEN (RN-13). La contraseña nueva sigue la política del alta (mínimo 8 caracteres,
        máximo 72 bytes). No inicia sesión: después hay que hacer login. Los JWT ya emitidos siguen vigentes hasta
        vencer (DM-03, DC-10). Operación pública.'
      operationId: restablecerPassword
      x-trazabilidad:
        api: API-13
        caso-de-uso: CU-08
        reglas:
        - RN-01
        - RN-03
        - RN-13
        secuencia: SEC-08
        servicio: SRV-13
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      responses:
        '204':
          description: Contraseña actualizada; sin cuerpo.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
        '400':
          description: 'VALIDATION_ERROR: La solicitud contiene datos inválidos. INVALID_RESET_TOKEN: El token de
            recuperación es inválido, venció o ya fue usado.'
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                VALIDATION_ERROR:
                  value:
                    timestamp: '2026-10-30T15:00:00Z'
                    status: 400
                    code: VALIDATION_ERROR
                    message: La solicitud contiene datos inválidos
                    path: /api/v1/auth/password/reset
                    correlationId: g02-demo-001
                    details:
                    - campo: password
                      mensaje: Debe tener al menos 8 caracteres
                INVALID_RESET_TOKEN:
                  value:
                    timestamp: '2026-10-30T15:00:00Z'
                    status: 400
                    code: INVALID_RESET_TOKEN
                    message: El token de recuperación es inválido, venció o ya fue usado
                    path: /api/v1/auth/password/reset
                    correlationId: g02-demo-001
        '500':
          description: 'INTERNAL_ERROR: Ocurrió un error interno.'
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                INTERNAL_ERROR:
                  value:
                    timestamp: '2026-10-30T15:00:00Z'
                    status: 500
                    code: INTERNAL_ERROR
                    message: Ocurrió un error interno
                    path: /api/v1/auth/password/reset
                    correlationId: g02-demo-001
      security: []
      requestBody:
        required: true
        description: Objeto JSON conforme al DTO; campos desconocidos se rechazan con 400 VALIDATION_ERROR (DC-01).
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestablecerPasswordRequest'
            examples:
              restablecimiento:
                value:
                  token: Qm9X2n8vKq1d0sT7yWJ4cFhZpL6aRu3eBgN5iVxMoDk
                  password: NuevaClave2026!
      x-estado-implementacion: Implementada; verificada con pruebas de integración (ver VERIFICACION.md)
  /api/v1/auth/refresh:
    post:
      tags:
      - Autenticación
      summary: Renovar sesión
      description: 'Con un JWT todavía vigente emite uno nuevo con el rol actual de la base (RN-14). Un token vencido
        no se renueva: hay que iniciar sesión de nuevo. La cuenta debe seguir ACTIVA. No admite API Key de módulo.
        Es una renovación deslizante sin token de renovación persistido (DM-15): mientras el usuario siga activo
        y renueve antes de vencer, la sesión continúa.'
      operationId: renovarSesion
      x-trazabilidad:
        api: API-14
        caso-de-uso: CU-09
        reglas:
        - RN-04
        - RN-09
        - RN-14
        secuencia: SEC-09
        servicio: SRV-14
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Sesión renovada.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              examples:
                sesion:
                  value:
                    token: eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxIiwicm9sZSI6IkNMSUVOVEUiLCJpYXQiOjE3OTMzNzI0MDAsImV4cCI6MTc5MzM3NjAwMH0.FIRMA_DE_EJEMPLO_NO_VALIDA
                    tipo: Bearer
                    expiraEn: '2026-10-30T16:00:00Z'
                    usuarioId: 1
                    nombre: Ana
                    rol: CLIENTE
        '401':
          description: 'UNAUTHENTICATED: El token falta, es inválido o está vencido, o la cuenta ya no existe.'
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            WWW-Authenticate:
              $ref: '#/components/headers/Authenticate'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                UNAUTHENTICATED:
                  value:
                    timestamp: '2026-10-30T15:00:00Z'
                    status: 401
                    code: UNAUTHENTICATED
                    message: La autenticación falta, es inválida o está vencida
                    path: /api/v1/auth/refresh
                    correlationId: g02-demo-001
        '403':
          description: 'USER_INACTIVE: La cuenta está inactiva. FORBIDDEN: La credencial no es de una persona (por
            ejemplo, una API Key de módulo).'
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                USER_INACTIVE:
                  value:
                    timestamp: '2026-10-30T15:00:00Z'
                    status: 403
                    code: USER_INACTIVE
                    message: La cuenta está inactiva
                    path: /api/v1/auth/refresh
                    correlationId: g02-demo-001
                FORBIDDEN:
                  value:
                    timestamp: '2026-10-30T15:00:00Z'
                    status: 403
                    code: FORBIDDEN
                    message: No tiene permiso para acceder a este recurso
                    path: /api/v1/auth/refresh
                    correlationId: g02-demo-001
        '500':
          description: 'INTERNAL_ERROR: Ocurrió un error interno.'
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                INTERNAL_ERROR:
                  value:
                    timestamp: '2026-10-30T15:00:00Z'
                    status: 500
                    code: INTERNAL_ERROR
                    message: Ocurrió un error interno
                    path: /api/v1/auth/refresh
                    correlationId: g02-demo-001
      x-estado-implementacion: Implementada; verificada con pruebas de integración (ver VERIFICACION.md)
  /api/v1/auth/session:
    get:
      tags:
      - Autenticación
      summary: Validar sesión
      description: 'Valida el JWT presentado contra la base: firma, vencimiento, existencia y estado de la cuenta.
        Devuelve el rol y el estado vigentes, que pueden diferir de los del token. Sirve a cualquier consumidor
        que necesite saber si un token del usuario sigue siendo utilizable sin tener la clave de firma. La cuenta
        debe seguir ACTIVA.'
      operationId: validarSesion
      x-trazabilidad:
        api: API-15
        caso-de-uso: CU-09
        reglas:
        - RN-04
        - RN-09
        secuencia: SEC-09
        servicio: SRV-15
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Sesión válida.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SesionResponse'
              examples:
                sesion:
                  value:
