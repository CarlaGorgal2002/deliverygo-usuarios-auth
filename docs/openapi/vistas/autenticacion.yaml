components:
  headers:
    Authenticate:
      description: Desafío de autenticación Bearer. En el login indica el esquema del recurso de autenticación;
        la API no usa HTTP Basic.
      schema:
        type: string
        example: Bearer realm="deliverygo-usuarios"
    CorrelationId:
      description: Identificador de correlación. Se reutiliza el recibido si es válido; en su ausencia se genera
        uno. Si la cabecera es inválida, la respuesta 400 usa uno nuevo (DC-06).
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: ^[A-Za-z0-9._-]+$
        example: g02-demo-001
        description: Reutiliza X-Correlation-Id válido o genera uno nuevo. Coincide con la cabecera de respuesta.
    NoStore:
      description: Impide almacenar datos de sesión y perfil en cachés compartidas.
      schema:
        type: string
        enum:
        - no-store
        example: no-store
  parameters:
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      description: Identificador de correlación. Se reutiliza el recibido si es válido; en su ausencia se genera
        uno. Si la cabecera es inválida, la respuesta 400 usa uno nuevo (DC-06).
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: ^[A-Za-z0-9._-]+$
        example: g02-demo-001
        description: Reutiliza X-Correlation-Id válido o genera uno nuevo. Coincide con la cabecera de respuesta.
  schemas:
    DetalleValidacion:
      type: object
      additionalProperties: false
      description: Detalle de validación de un campo (DTO-08). Para ruta o cabecera se usa su nombre; para un JSON
        ilegible, body.
      required:
      - campo
      - mensaje
      properties:
        campo:
          type: string
          minLength: 1
          pattern: \S
          example: email
        mensaje:
          type: string
          minLength: 1
          pattern: \S
          example: Debe tener un formato de email válido
    ErrorResponse:
      type: object
      additionalProperties: false
      description: DTO-08. Error común de Controller, Service y Security. status coincide con el código HTTP. Nunca
        expone stack traces, SQL, tokens ni contraseñas.
      required:
      - timestamp
      - status
      - code
      - message
      - path
      - correlationId
      properties:
        timestamp:
          type: string
          format: date-time
          description: Fecha ISO-8601 con zona horaria; se usa UTC en los ejemplos (DC-04).
          example: '2026-10-30T15:00:00Z'
        status:
          type: integer
          minimum: 400
          maximum: 599
          example: 400
        code:
          type: string
          enum:
          - VALIDATION_ERROR
          - UNAUTHENTICATED
          - INVALID_CREDENTIALS
          - FORBIDDEN
          - USER_INACTIVE
          - USER_NOT_FOUND
          - ADDRESS_NOT_FOUND
          - EMAIL_ALREADY_REGISTERED
          - INVALID_RESET_TOKEN
          - INTERNAL_ERROR
          example: VALIDATION_ERROR
        message:
          type: string
          minLength: 1
          pattern: \S
          example: La solicitud contiene datos inválidos
        path:
          type: string
          pattern: ^/api/v1/
          example: /api/v1/auth/register
          description: Ruta concreta solicitada, sin query string, credenciales ni datos internos.
        correlationId:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9._-]+$
          example: g02-demo-001
          description: Reutiliza X-Correlation-Id válido o genera uno nuevo. Coincide con la cabecera de respuesta.
        details:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/DetalleValidacion'
          description: Sólo se incluye en VALIDATION_ERROR. Para errores generales de JSON se usa campo body; no
            incluye valores recibidos ni contraseñas.
      x-dto-id: DTO-08
    EstadoUsuario:
      type: string
      enum:
      - ACTIVO
      - INACTIVO
      example: ACTIVO
    LoginRequest:
      type: object
      additionalProperties: false
      description: DTO-03. Autenticación por email y contraseña; no utiliza username.
      required:
      - email
      - password
      properties:
        email:
          type: string
          minLength: 1
          maxLength: 120
          pattern: \S
          example: ana.perez@example.com
          format: email
          description: Email válido. Se recortan espacios exteriores y se normaliza a minúsculas antes de comparar
            o persistir (DC-02).
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 1
          pattern: \S
          description: Obligatoria y no vacía. Se verifica sin recortar ni normalizar; la política de alta no se
            reaplica al login (DC-05).
          example: ClaveDemo2026!
      x-dto-id: DTO-03
    LoginResponse:
      type: object
      additionalProperties: false
      description: DTO-04. Token y datos mínimos para el Portal. La firma asimétrica es el objetivo de integración
        de la teoría; la distribución de claves debe acordarse. El token de ejemplo no es utilizable.
      required:
      - token
      - tipo
      - expiraEn
      - usuarioId
      - nombre
      - rol
      properties:
        token:
          type: string
          minLength: 1
          description: JWT firmado. El ejemplo tiene firma ficticia y no permite autenticarse.
          example: eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxIiwicm9sZSI6IkNMSUVOVEUiLCJpYXQiOjE3OTMzNzI0MDAsImV4cCI6MTc5MzM3NjAwMH0.FIRMA_DE_EJEMPLO_NO_VALIDA
        tipo:
          type: string
          enum:
          - Bearer
          example: Bearer
        expiraEn:
          type: string
          format: date-time
          description: Vencimiento absoluto del JWT. Debe corresponder al claim exp; no es una duración en segundos.
          example: '2026-10-30T16:00:00Z'
        usuarioId:
          type: integer
          format: int64
          minimum: 1
          maximum: 9223372036854775807
          example: 1
        nombre:
          type: string
          minLength: 1
          maxLength: 80
          pattern: \S
          example: Ana
        rol:
          $ref: '#/components/schemas/Rol'
      x-dto-id: DTO-04
    RegistrarUsuarioRequest:
      type: object
      additionalProperties: false
      description: DTO-01. No admite id, rol, estado, fechaAlta ni passwordHash. El servidor asigna identidad, rol
        CLIENTE y estado ACTIVO.
      required:
      - nombre
      - apellido
      - email
      - password
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 80
          pattern: \S
          example: Ana
        apellido:
          type: string
          minLength: 1
          maxLength: 80
          pattern: \S
          example: Pérez
        email:
          type: string
          minLength: 1
          maxLength: 120
          pattern: \S
          example: ana.perez@example.com
          format: email
          description: Email válido. Se recortan espacios exteriores y se normaliza a minúsculas antes de comparar
            o persistir (DC-02).
        telefono:
          type: string
          maxLength: 30
          nullable: true
          description: Opcional. Ausente, null o en blanco significa sin teléfono; en PUT elimina el valor anterior
            (DC-03).
          example: +54 11 5555 0101
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 8
          pattern: \S
          description: 'Mínimo 8 caracteres (RN-01). No recortar ni normalizar. Nunca se devuelve ni se registra
            en logs. Máximo 72 bytes en UTF-8: es el límite de BCrypt y el servidor lo rechaza con 400.'
          example: ClaveDemo2026!
      x-dto-id: DTO-01
    RestablecerPasswordRequest:
      type: object
      additionalProperties: false
      description: DTO-13 (CU-08). Token de un solo uso recibido por Notificaciones y la contraseña nueva, con la
        política del alta.
      required:
      - token
      - password
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 128
          pattern: \S
          description: Token de un solo uso; vence a los 30 minutos por defecto. Sólo se conserva su hash.
          example: Qm9X2n8vKq1d0sT7yWJ4cFhZpL6aRu3eBgN5iVxMoDk
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 8
          pattern: \S
          description: 'Mínimo 8 caracteres (RN-01). No recortar ni normalizar. Nunca se devuelve ni se registra
            en logs. Máximo 72 bytes en UTF-8: es el límite de BCrypt y el servidor lo rechaza con 400.'
          example: NuevaClave2026!
      x-dto-id: DTO-13
    Rol:
      type: string
      enum:
      - CLIENTE
      - COMERCIO
      - REPARTIDOR
      - ADMIN
      example: CLIENTE
      description: Un rol por usuario (REL-02). El registro público siempre asigna CLIENTE. Los demás roles los
        asigna un ADMIN con CU-07 (API-11); el primer ADMIN se aprovisiona por configuración (DM-07).
    SesionResponse:
      type: object
      additionalProperties: false
      description: DTO-14 (CU-09). Resultado de validar un JWT contra la base. rol y estado son los vigentes, que
        pueden diferir de los del token si la cuenta cambió después de emitirlo.
      required:
