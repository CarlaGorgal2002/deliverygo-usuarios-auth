          example: '2026-10-30T15:00:00Z'
          readOnly: true
      x-dto-id: DTO-02
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT de usuario emitido por POST /api/v1/auth/login (o renovado con /api/v1/auth/refresh). En
        Swagger UI pegar sólo el token. sub contiene el id del usuario como texto; role su rol; exp el vencimiento.
        Validar firma, vencimiento, titularidad y estado en backend. No es una credencial de módulo.
    moduleApiKey:
      type: apiKey
