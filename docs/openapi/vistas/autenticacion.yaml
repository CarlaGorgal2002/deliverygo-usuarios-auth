      name: X-Api-Key
      description: 'Credencial propia de un módulo consumidor (Pedidos, Logística, Catálogo, Notificaciones, Pagos,
        Opiniones y Analítica), entregada por el equipo de Usuarios y enviada servidor a servidor. Sólo permite
        leer: API-03, API-05 (únicamente Pedidos) y API-16. Se configura por variable de entorno; una clave vacía
        o de menos de 16 caracteres deja al módulo sin acceso. Si la solicitud trae también Authorization, manda
        el JWT. No es una credencial de usuario.'
