          minLength: 1
          maxLength: 120
          pattern: \S
          example: ana.perez@example.com
          format: email
          description: Email válido. Se recortan espacios exteriores y se normaliza a minúsculas antes de comparar
            o persistir (DC-02).
      x-dto-id: DTO-12
    UsuarioResponse:
      type: object
      additionalProperties: false
      description: DTO-02. Perfil sin contraseña ni hash. No incluye direcciones; se consultan mediante API-05.
        Los campos opcionales sin valor se devuelven como null (DC-03).
      required:
      - id
      - nombre
      - apellido
      - email
      - telefono
      - rol
      - estado
      - fechaAlta
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          maximum: 9223372036854775807
          example: 1
          readOnly: true
        nombre:
          type: string
          minLength: 1
          maxLength: 80
          pattern: \S
          example: Ana
        apellido:
          type: string
          minLength: 1
          maxLength: 80
          pattern: \S
          example: Pérez
        email:
          type: string
          minLength: 1
          maxLength: 120
          pattern: \S
          example: ana.perez@example.com
          format: email
          description: Email válido. Se recortan espacios exteriores y se normaliza a minúsculas antes de comparar
            o persistir (DC-02).
        telefono:
          type: string
          maxLength: 30
          nullable: true
          description: Teléfono de contacto; null si no se informó.
