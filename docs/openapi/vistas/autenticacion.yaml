                  value:
                    timestamp: '2026-10-30T15:00:00Z'
                    status: 401
                    code: UNAUTHENTICATED
                    message: La autenticación falta, es inválida o está vencida
                    path: /api/v1/auth/session
                    correlationId: g02-demo-001
        '403':
          description: 'USER_INACTIVE: La cuenta está inactiva. FORBIDDEN: La credencial no es de una persona (por
            ejemplo, una API Key de módulo).'
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                USER_INACTIVE:
                  value:
                    timestamp: '2026-10-30T15:00:00Z'
                    status: 403
                    code: USER_INACTIVE
                    message: La cuenta está inactiva
                    path: /api/v1/auth/session
                    correlationId: g02-demo-001
                FORBIDDEN:
                  value:
                    timestamp: '2026-10-30T15:00:00Z'
                    status: 403
                    code: FORBIDDEN
                    message: No tiene permiso para acceder a este recurso
                    path: /api/v1/auth/session
                    correlationId: g02-demo-001
        '500':
          description: 'INTERNAL_ERROR: Ocurrió un error interno.'
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                INTERNAL_ERROR:
                  value:
                    timestamp: '2026-10-30T15:00:00Z'
                    status: 500
                    code: INTERNAL_ERROR
                    message: Ocurrió un error interno
                    path: /api/v1/auth/session
                    correlationId: g02-demo-001
