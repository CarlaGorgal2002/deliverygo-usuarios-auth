# GENERADO: editar deliverygo-usuarios.yaml y ejecutar exportar_vistas.py.
openapi: 3.0.3
info:
  title: DeliveryGo - Usuarios y Autenticación - Grupo 02 - Autenticación
  version: 1.0.0
  description: |-
    Vista generada por área. Es parte del mismo servicio, no un microservicio independiente. El contrato completo y editable es deliverygo-usuarios.yaml.

    Contrato objetivo de los cinco casos de uso CORE (CU-01 a CU-05), con nueve operaciones API-01 a API-09.
    Basado en G02_Usuarios_PrimeraEntrega_v1.5.pdf, consigna, guía funcional, teoría, publicaciones y clases, hasta el material adjunto.
    Grupo académico 02; módulo Usuarios, identificado como Equipo 1 en la guía general.

    Contrato de entrega del 30/10/2026. El backend del repositorio implementa las nueve operaciones y las verifican las pruebas de integración (VERIFICACION.md).
    Los acuerdos pendientes con otros módulos se describen en ACUERDOS_Y_BRECHAS.md. CU-06 a CU-10 quedan en el backlog de evolución.

    Convenciones: rutas /api/v1; JSON UTF-8; IDs Long positivos; DTO separados de entidades; fechas ISO-8601 con zona;
    errores normalizados; PUT completo; baja lógica con 204 sin cuerpo. Datos de ejemplo ficticios.
    La autenticación Bearer de usuario se formaliza aquí. Las credenciales propias entre módulos todavía requieren acuerdo
    y no se sustituyen por roles humanos privilegiados. Usuarios emite el JWT; cada servicio valida firma, vencimiento y permisos.
    El objetivo de firma es asimétrico, conforme a la teoría. No se distribuyen claves privadas en el contrato.

    Decisiones que completan ambigüedades de la primera entrega: DC-01 campos desconocidos rechazados;
    DC-02 normalización de email; DC-03 ausencia/null de opcionales y reemplazo PUT;
    DC-04 zona horaria; DC-05 validación de login; DC-06 correlación; DC-07 errores de ruta y usuario inexistente.
    Se documentan como decisiones del equipo, no como nuevas instrucciones del profesor.
  contact:
    name: Grupo 02 - Usuarios y Autenticación
servers:
- url: http://localhost:8089
  description: Puerto de desarrollo configurado en el repositorio.
- url: '{scheme}://{host}:{port}'
  description: Integración; reemplazar host y puerto por los acordados. No representa un despliegue existente.
  variables:
    scheme:
      default: http
      enum:
      - http
      - https
      description: HTTP sólo para laboratorio controlado; HTTPS para entornos expuestos.
    host:
      default: localhost
      description: Host del módulo Usuarios, pendiente de asignación.
    port:
      default: '8089'
      description: Puerto del módulo Usuarios.
tags:
- name: Autenticación
  description: CU-01 y CU-02. Registro y emisión centralizada de JWT.
security:
- bearerAuth: []
paths:
  /api/v1/auth/register:
    post:
      tags:
      - Autenticación
      summary: Registrar usuario
      description: |-
        Crea un usuario con rol CLIENTE, estado ACTIVO y email único. La contraseña se almacena mediante hash irreversible.
        No se emite JWT: luego debe ejecutarse el login. La unicidad del email también debe garantizarse ante concurrencia.
        La bienvenida INT-01 es no bloqueante: un fallo de Notificaciones no revierte el registro ni cambia el 201.
        INT-01 permanece como mock declarado hasta disponer del contrato del equipo de Notificaciones.
      operationId: registrarUsuario
      x-trazabilidad:
        api: API-01
        caso-de-uso: CU-01
        reglas:
        - RN-01
        - RN-02
        - RN-03
        - RN-06
        secuencia: SEC-01
        servicio: SRV-01
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      responses:
        '201':
          description: 'Registrar usuario: operación completada.'
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Location:
              description: URI del recurso creado. Para recuperar direcciones se utiliza el listado API-05.
              schema:
                type: string
                format: uri-reference
                example: /api/v1/users/1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioResponse'
              examples:
                usuarioCreado:
                  value:
                    id: 1
                    nombre: Ana
                    apellido: Pérez
                    email: ana.perez@example.com
                    telefono: +54 11 5555 0101
                    rol: CLIENTE
                    estado: ACTIVO
                    fechaAlta: '2026-10-30T15:00:00Z'
        '400':
          description: 'VALIDATION_ERROR: La solicitud contiene datos inválidos.'
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                VALIDATION_ERROR:
                  value:
                    timestamp: '2026-10-30T15:00:00Z'
                    status: 400
                    code: VALIDATION_ERROR
                    message: La solicitud contiene datos inválidos
                    path: /api/v1/auth/register
                    correlationId: g02-demo-001
                    details:
                    - campo: body
                      mensaje: El cuerpo debe ser JSON válido
        '409':
          description: 'EMAIL_ALREADY_REGISTERED: El email ya está registrado.'
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                EMAIL_ALREADY_REGISTERED:
                  value:
                    timestamp: '2026-10-30T15:00:00Z'
                    status: 409
                    code: EMAIL_ALREADY_REGISTERED
                    message: El email ya está registrado
                    path: /api/v1/auth/register
                    correlationId: g02-demo-001
        '500':
          description: 'INTERNAL_ERROR: Ocurrió un error interno.'
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                INTERNAL_ERROR:
                  value:
                    timestamp: '2026-10-30T15:00:00Z'
                    status: 500
                    code: INTERNAL_ERROR
                    message: Ocurrió un error interno
                    path: /api/v1/auth/register
                    correlationId: g02-demo-001
      security: []
      requestBody:
        required: true
        description: Objeto JSON conforme al DTO; campos desconocidos se rechazan con 400 VALIDATION_ERROR (DC-01).
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrarUsuarioRequest'
            examples:
              conTelefono:
                value:
                  nombre: Ana
                  apellido: Pérez
                  email: ana.perez@example.com
                  telefono: +54 11 5555 0101
                  password: ClaveDemo2026!
              sinTelefono:
                value:
                  nombre: Ana
                  apellido: Pérez
                  email: ana.perez@example.com
                  password: ClaveDemo2026!
      x-estado-implementacion: Implementada; verificada con pruebas de integración (ver VERIFICACION.md)
  /api/v1/auth/login:
    post:
      tags:
      - Autenticación
      summary: Iniciar sesión
      description: |-
        Autentica mediante email y password. Email inexistente y contraseña incorrecta producen el mismo 401 INVALID_CREDENTIALS.
        Sólo después de verificar la contraseña se comprueba el estado; una cuenta INACTIVA devuelve 403 USER_INACTIVE.
        El JWT identifica al usuario con sub (id convertido a texto), role y exp; iat registra su emisión.
        El Portal adjunta Authorization: Bearer <token>. Cada backend valida firma, vencimiento y permisos; decodificar en React no autoriza.
        expiraEn es una fecha absoluta, no expiresInSeconds. La vigencia es configurable; una hora es sólo el ejemplo.
        Esta operación es pública aun si el navegador conserva un token viejo.
      operationId: iniciarSesion
      x-trazabilidad:
        api: API-02
        caso-de-uso: CU-02
        reglas:
        - RN-01
        - RN-03
        - RN-04
        - RN-08
        - RN-09
        secuencia: SEC-02
        servicio: SRV-02
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: 'Iniciar sesión: operación completada.'
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              examples:
                sesion:
                  value:
                    token: eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxIiwicm9sZSI6IkNMSUVOVEUiLCJpYXQiOjE3OTMzNzI0MDAsImV4cCI6MTc5MzM3NjAwMH0.FIRMA_DE_EJEMPLO_NO_VALIDA
                    tipo: Bearer
                    expiraEn: '2026-10-30T16:00:00Z'
                    usuarioId: 1
                    nombre: Ana
                    rol: CLIENTE
        '400':
          description: 'VALIDATION_ERROR: La solicitud contiene datos inválidos.'
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                VALIDATION_ERROR:
                  value:
                    timestamp: '2026-10-30T15:00:00Z'
                    status: 400
                    code: VALIDATION_ERROR
                    message: La solicitud contiene datos inválidos
                    path: /api/v1/auth/login
                    correlationId: g02-demo-001
                    details:
                    - campo: body
                      mensaje: El cuerpo debe ser JSON válido
        '401':
          description: 'INVALID_CREDENTIALS: Email o contraseña incorrectos.'
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            WWW-Authenticate:
              $ref: '#/components/headers/Authenticate'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                INVALID_CREDENTIALS:
                  value:
                    timestamp: '2026-10-30T15:00:00Z'
                    status: 401
                    code: INVALID_CREDENTIALS
                    message: Email o contraseña incorrectos
                    path: /api/v1/auth/login
                    correlationId: g02-demo-001
        '403':
          description: 'USER_INACTIVE: La cuenta está inactiva.'
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                USER_INACTIVE:
                  value:
                    timestamp: '2026-10-30T15:00:00Z'
                    status: 403
                    code: USER_INACTIVE
                    message: La cuenta está inactiva
                    path: /api/v1/auth/login
                    correlationId: g02-demo-001
        '500':
          description: 'INTERNAL_ERROR: Ocurrió un error interno.'
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                INTERNAL_ERROR:
                  value:
                    timestamp: '2026-10-30T15:00:00Z'
                    status: 500
                    code: INTERNAL_ERROR
                    message: Ocurrió un error interno
                    path: /api/v1/auth/login
                    correlationId: g02-demo-001
      security: []
      requestBody:
        required: true
        description: Objeto JSON conforme al DTO; campos desconocidos se rechazan con 400 VALIDATION_ERROR (DC-01).
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              credenciales:
                value:
                  email: ana.perez@example.com
                  password: ClaveDemo2026!
      x-estado-implementacion: Implementada; verificada con pruebas de integración (ver VERIFICACION.md)
components:
  headers:
    Authenticate:
      description: Desafío de autenticación Bearer. En el login indica el esquema del recurso de autenticación;
        la API no usa HTTP Basic.
      schema:
        type: string
        example: Bearer realm="deliverygo-usuarios"
    CorrelationId:
      description: Identificador de correlación. Se reutiliza el recibido si es válido; en su ausencia se genera
        uno. Si la cabecera es inválida, la respuesta 400 usa uno nuevo (DC-06).
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: ^[A-Za-z0-9._-]+$
        example: g02-demo-001
        description: Reutiliza X-Correlation-Id válido o genera uno nuevo. Coincide con la cabecera de respuesta.
    NoStore:
      description: Impide almacenar datos de sesión y perfil en cachés compartidas.
      schema:
        type: string
        enum:
        - no-store
        example: no-store
  parameters:
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      description: Identificador de correlación. Se reutiliza el recibido si es válido; en su ausencia se genera
        uno. Si la cabecera es inválida, la respuesta 400 usa uno nuevo (DC-06).
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: ^[A-Za-z0-9._-]+$
        example: g02-demo-001
        description: Reutiliza X-Correlation-Id válido o genera uno nuevo. Coincide con la cabecera de respuesta.
  schemas:
    DetalleValidacion:
      type: object
      additionalProperties: false
      description: Detalle de validación de un campo (DTO-08). Para ruta o cabecera se usa su nombre; para un JSON
        ilegible, body.
      required:
      - campo
      - mensaje
      properties:
        campo:
          type: string
          minLength: 1
          pattern: \S
          example: email
        mensaje:
          type: string
          minLength: 1
          pattern: \S
          example: Debe tener un formato de email válido
    ErrorResponse:
      type: object
      additionalProperties: false
      description: DTO-08. Error común de Controller, Service y Security. status coincide con el código HTTP. Nunca
        expone stack traces, SQL, tokens ni contraseñas.
      required:
      - timestamp
      - status
      - code
      - message
      - path
      - correlationId
      properties:
        timestamp:
          type: string
          format: date-time
          description: Fecha ISO-8601 con zona horaria; se usa UTC en los ejemplos (DC-04).
          example: '2026-10-30T15:00:00Z'
        status:
          type: integer
          minimum: 400
          maximum: 599
          example: 400
        code:
          type: string
          enum:
          - VALIDATION_ERROR
          - UNAUTHENTICATED
          - INVALID_CREDENTIALS
          - FORBIDDEN
          - USER_INACTIVE
          - USER_NOT_FOUND
          - ADDRESS_NOT_FOUND
          - EMAIL_ALREADY_REGISTERED
          - INTERNAL_ERROR
          example: VALIDATION_ERROR
        message:
          type: string
          minLength: 1
          pattern: \S
          example: La solicitud contiene datos inválidos
        path:
          type: string
          pattern: ^/api/v1/
          example: /api/v1/auth/register
          description: Ruta concreta solicitada, sin query string, credenciales ni datos internos.
        correlationId:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9._-]+$
          example: g02-demo-001
          description: Reutiliza X-Correlation-Id válido o genera uno nuevo. Coincide con la cabecera de respuesta.
        details:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/DetalleValidacion'
          description: Sólo se incluye en VALIDATION_ERROR. Para errores generales de JSON se usa campo body; no
            incluye valores recibidos ni contraseñas.
      x-dto-id: DTO-08
    EstadoUsuario:
      type: string
      enum:
      - ACTIVO
      - INACTIVO
      example: ACTIVO
    LoginRequest:
      type: object
      additionalProperties: false
      description: DTO-03. Autenticación por email y contraseña; no utiliza username.
      required:
      - email
      - password
      properties:
        email:
          type: string
          minLength: 1
          maxLength: 120
          pattern: \S
          example: ana.perez@example.com
          format: email
          description: Email válido. Se recortan espacios exteriores y se normaliza a minúsculas antes de comparar
            o persistir (DC-02).
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 1
          pattern: \S
          description: Obligatoria y no vacía. Se verifica sin recortar ni normalizar; la política de alta no se
            reaplica al login (DC-05).
          example: ClaveDemo2026!
      x-dto-id: DTO-03
    LoginResponse:
      type: object
      additionalProperties: false
      description: DTO-04. Token y datos mínimos para el Portal. La firma asimétrica es el objetivo de integración
        de la teoría; la distribución de claves debe acordarse. El token de ejemplo no es utilizable.
      required:
      - token
      - tipo
      - expiraEn
      - usuarioId
      - nombre
      - rol
      properties:
        token:
          type: string
          minLength: 1
          description: JWT firmado. El ejemplo tiene firma ficticia y no permite autenticarse.
          example: eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxIiwicm9sZSI6IkNMSUVOVEUiLCJpYXQiOjE3OTMzNzI0MDAsImV4cCI6MTc5MzM3NjAwMH0.FIRMA_DE_EJEMPLO_NO_VALIDA
        tipo:
          type: string
          enum:
          - Bearer
          example: Bearer
        expiraEn:
          type: string
          format: date-time
          description: Vencimiento absoluto del JWT. Debe corresponder al claim exp; no es una duración en segundos.
          example: '2026-10-30T16:00:00Z'
        usuarioId:
          type: integer
          format: int64
          minimum: 1
          maximum: 9223372036854775807
          example: 1
        nombre:
          type: string
          minLength: 1
          maxLength: 80
          pattern: \S
          example: Ana
        rol:
          $ref: '#/components/schemas/Rol'
      x-dto-id: DTO-04
    RegistrarUsuarioRequest:
      type: object
      additionalProperties: false
      description: DTO-01. No admite id, rol, estado, fechaAlta ni passwordHash. El servidor asigna identidad, rol
        CLIENTE y estado ACTIVO.
      required:
      - nombre
      - apellido
      - email
      - password
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 80
          pattern: \S
          example: Ana
        apellido:
          type: string
          minLength: 1
          maxLength: 80
          pattern: \S
          example: Pérez
        email:
          type: string
          minLength: 1
          maxLength: 120
          pattern: \S
          example: ana.perez@example.com
          format: email
          description: Email válido. Se recortan espacios exteriores y se normaliza a minúsculas antes de comparar
            o persistir (DC-02).
        telefono:
          type: string
          maxLength: 30
          nullable: true
          description: Opcional. Ausente, null o en blanco significa sin teléfono; en PUT elimina el valor anterior
            (DC-03).
          example: +54 11 5555 0101
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 8
          pattern: \S
          description: 'Mínimo 8 caracteres (RN-01). No recortar ni normalizar. Nunca se devuelve ni se registra
            en logs. Máximo 72 bytes en UTF-8: es el límite de BCrypt y el servidor lo rechaza con 400.'
          example: ClaveDemo2026!
      x-dto-id: DTO-01
    Rol:
      type: string
      enum:
      - CLIENTE
      - COMERCIO
      - REPARTIDOR
      - ADMIN
      example: CLIENTE
      description: Un rol por usuario (REL-02). El registro público siempre asigna CLIENTE. Otros roles requieren
        aprovisionamiento controlado; su administración es CU-07, fuera del CORE.
    UsuarioResponse:
      type: object
      additionalProperties: false
      description: DTO-02. Perfil sin contraseña ni hash. No incluye direcciones; se consultan mediante API-05.
        Los campos opcionales sin valor se devuelven como null (DC-03).
      required:
      - id
      - nombre
      - apellido
      - email
      - telefono
      - rol
      - estado
      - fechaAlta
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          maximum: 9223372036854775807
          example: 1
          readOnly: true
        nombre:
          type: string
          minLength: 1
          maxLength: 80
          pattern: \S
          example: Ana
        apellido:
          type: string
          minLength: 1
          maxLength: 80
          pattern: \S
          example: Pérez
        email:
          type: string
          minLength: 1
          maxLength: 120
          pattern: \S
          example: ana.perez@example.com
          format: email
          description: Email válido. Se recortan espacios exteriores y se normaliza a minúsculas antes de comparar
            o persistir (DC-02).
        telefono:
          type: string
          maxLength: 30
          nullable: true
          description: Teléfono de contacto; null si no se informó.
          example: +54 11 5555 0101
        rol:
          $ref: '#/components/schemas/Rol'
        estado:
          $ref: '#/components/schemas/EstadoUsuario'
        fechaAlta:
          type: string
          format: date-time
          description: Fecha ISO-8601 con zona horaria; se usa UTC en los ejemplos (DC-04).
          example: '2026-10-30T15:00:00Z'
          readOnly: true
      x-dto-id: DTO-02
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT de usuario emitido por POST /api/v1/auth/login. En Swagger UI pegar sólo el token. sub contiene
        el id del usuario como texto; role su rol; exp el vencimiento. Validar firma, vencimiento, titularidad y
        estado en backend. No es una credencial de módulo.
x-jwt-usuario:
  estado: 'Claims sub, role, iat y exp implementados por el backend. Pendiente: firma asimétrica (hoy HS256 con
    clave compartida configurable por JWT_SECRET).'
  claims:
    sub: Identificador Long del usuario convertido a string, estable ante cambios de email.
    role: 'Rol actual: CLIENTE, COMERCIO, REPARTIDOR o ADMIN, sin prefijo ROLE_.'
    iat: NumericDate de emisión, segundos desde Unix epoch.
    exp: NumericDate de vencimiento, segundos desde Unix epoch; corresponde a expiraEn.
  ejemplo-payload:
    sub: '1'
    role: CLIENTE
    iat: 1793372400
    exp: 1793376000
  firma: Objetivo asimétrico; RS256 es una propuesta de implementación, no un acuerdo interequipos confirmado.
  pendientes:
  - Distribución y rotación de claves públicas
  - Emisor, audiencias y algoritmo definitivo
  - Identidad y permisos de las credenciales propias de módulos
