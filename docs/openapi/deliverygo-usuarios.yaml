                    message: No tiene permiso para acceder a este recurso
                    path: /api/v1/users/1
                    correlationId: g02-demo-001
                USER_INACTIVE:
                  value:
                    timestamp: '2026-10-30T15:00:00Z'
                    status: 403
                    code: USER_INACTIVE
                    message: La cuenta está inactiva
                    path: /api/v1/users/1
                    correlationId: g02-demo-001
        '404':
          description: 'USER_NOT_FOUND: Usuario no encontrado.'
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
