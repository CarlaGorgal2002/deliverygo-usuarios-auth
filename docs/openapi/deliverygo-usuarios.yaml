                    calle: Av. Independencia
                    numero: '1200'
                    piso: '2'
                    departamento: B
                    ciudad: Ciudad Autónoma de Buenos Aires
                    provincia: Ciudad Autónoma de Buenos Aires
                    codigoPostal: C1099AAZ
                    predeterminada: true
        '400':
          description: 'VALIDATION_ERROR: La solicitud contiene datos inválidos.'
          headers:
