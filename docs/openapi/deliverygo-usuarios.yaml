components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT de usuario emitido por POST /api/v1/auth/login. En Swagger UI pegar sólo el token. sub contiene
        el id del usuario como texto; role su rol; exp el vencimiento. Validar firma, vencimiento, titularidad y
        estado en backend. No es una credencial de módulo.
  parameters:
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      description: Identificador de correlación. Se reutiliza el recibido si es válido; en su ausencia se genera
        uno. Si la cabecera es inválida, la respuesta 400 usa uno nuevo (DC-06).
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: ^[A-Za-z0-9._-]+$
        example: g02-demo-001
        description: Reutiliza X-Correlation-Id válido o genera uno nuevo. Coincide con la cabecera de respuesta.
    UsuarioId:
      name: id
      in: path
      required: true
      description: Identificador Long positivo del usuario. En llamadas de usuario debe coincidir con sub del JWT.
      schema:
        type: integer
        format: int64
        minimum: 1
        maximum: 9223372036854775807
        example: 1
    DireccionId:
      name: addressId
      in: path
      required: true
      description: Identificador Long positivo de una dirección activa del usuario indicado en id.
      schema:
        type: integer
        format: int64
        minimum: 1
        maximum: 9223372036854775807
        example: 10
  headers:
    CorrelationId:
      description: Identificador de correlación. Se reutiliza el recibido si es válido; en su ausencia se genera
        uno. Si la cabecera es inválida, la respuesta 400 usa uno nuevo (DC-06).
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: ^[A-Za-z0-9._-]+$
        example: g02-demo-001
        description: Reutiliza X-Correlation-Id válido o genera uno nuevo. Coincide con la cabecera de respuesta.
    Authenticate:
      description: Desafío de autenticación Bearer. En el login indica el esquema del recurso de autenticación;
        la API no usa HTTP Basic.
      schema:
        type: string
        example: Bearer realm="deliverygo-usuarios"
    NoStore:
      description: Impide almacenar datos de sesión y perfil en cachés compartidas.
      schema:
        type: string
        enum:
        - no-store
        example: no-store
  schemas:
    RegistrarUsuarioRequest:
      type: object
      additionalProperties: false
      description: DTO-01. No admite id, rol, estado, fechaAlta ni passwordHash. El servidor asigna identidad, rol
        CLIENTE y estado ACTIVO.
      required:
      - nombre
      - apellido
      - email
      - password
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 80
          pattern: \S
          example: Ana
        apellido:
          type: string
          minLength: 1
          maxLength: 80
          pattern: \S
          example: Pérez
        email:
          type: string
          minLength: 1
          maxLength: 120
          pattern: \S
          example: ana.perez@example.com
          format: email
          description: Email válido. Se recortan espacios exteriores y se normaliza a minúsculas antes de comparar
            o persistir (DC-02).
        telefono:
          type: string
          maxLength: 30
          nullable: true
          description: Opcional. Ausente, null o en blanco significa sin teléfono; en PUT elimina el valor anterior
            (DC-03).
          example: +54 11 5555 0101
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 8
          pattern: \S
          description: 'Mínimo 8 caracteres (RN-01). No recortar ni normalizar. Nunca se devuelve ni se registra
            en logs. Máximo 72 bytes en UTF-8: es el límite de BCrypt y el servidor lo rechaza con 400.'
          example: ClaveDemo2026!
      x-dto-id: DTO-01
    UsuarioResponse:
      type: object
      additionalProperties: false
      description: DTO-02. Perfil sin contraseña ni hash. No incluye direcciones; se consultan mediante API-05.
        Los campos opcionales sin valor se devuelven como null (DC-03).
      required:
      - id
      - nombre
      - apellido
      - email
      - telefono
      - rol
      - estado
      - fechaAlta
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          maximum: 9223372036854775807
          example: 1
          readOnly: true
        nombre:
          type: string
          minLength: 1
          maxLength: 80
          pattern: \S
          example: Ana
        apellido:
          type: string
          minLength: 1
          maxLength: 80
          pattern: \S
          example: Pérez
        email:
          type: string
          minLength: 1
          maxLength: 120
          pattern: \S
          example: ana.perez@example.com
          format: email
          description: Email válido. Se recortan espacios exteriores y se normaliza a minúsculas antes de comparar
            o persistir (DC-02).
        telefono:
          type: string
          maxLength: 30
          nullable: true
          description: Teléfono de contacto; null si no se informó.
          example: +54 11 5555 0101
        rol:
          $ref: '#/components/schemas/Rol'
        estado:
          $ref: '#/components/schemas/EstadoUsuario'
        fechaAlta:
          type: string
          format: date-time
          description: Fecha ISO-8601 con zona horaria; se usa UTC en los ejemplos (DC-04).
          example: '2026-10-30T15:00:00Z'
          readOnly: true
      x-dto-id: DTO-02
    LoginRequest:
      type: object
      additionalProperties: false
      description: DTO-03. Autenticación por email y contraseña; no utiliza username.
      required:
      - email
      - password
      properties:
        email:
          type: string
          minLength: 1
          maxLength: 120
          pattern: \S
          example: ana.perez@example.com
          format: email
          description: Email válido. Se recortan espacios exteriores y se normaliza a minúsculas antes de comparar
            o persistir (DC-02).
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 1
          pattern: \S
          description: Obligatoria y no vacía. Se verifica sin recortar ni normalizar; la política de alta no se
            reaplica al login (DC-05).
          example: ClaveDemo2026!
      x-dto-id: DTO-03
    LoginResponse:
      type: object
      additionalProperties: false
      description: DTO-04. Token y datos mínimos para el Portal. La firma asimétrica es el objetivo de integración
        de la teoría; la distribución de claves debe acordarse. El token de ejemplo no es utilizable.
      required:
      - token
      - tipo
      - expiraEn
      - usuarioId
      - nombre
      - rol
      properties:
        token:
          type: string
          minLength: 1
          description: JWT firmado. El ejemplo tiene firma ficticia y no permite autenticarse.
          example: eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxIiwicm9sZSI6IkNMSUVOVEUiLCJpYXQiOjE3OTMzNzI0MDAsImV4cCI6MTc5MzM3NjAwMH0.FIRMA_DE_EJEMPLO_NO_VALIDA
        tipo:
          type: string
          enum:
          - Bearer
          example: Bearer
        expiraEn:
          type: string
          format: date-time
          description: Vencimiento absoluto del JWT. Debe corresponder al claim exp; no es una duración en segundos.
          example: '2026-10-30T16:00:00Z'
        usuarioId:
          type: integer
          format: int64
          minimum: 1
          maximum: 9223372036854775807
          example: 1
        nombre:
          type: string
          minLength: 1
          maxLength: 80
          pattern: \S
          example: Ana
        rol:
          $ref: '#/components/schemas/Rol'
      x-dto-id: DTO-04
    ModificarPerfilRequest:
      type: object
      additionalProperties: false
      description: DTO-05. PUT reemplaza todos los datos editables; telefono ausente/null/en blanco borra el anterior.
        No admite rol, estado ni password (RN-10).
      required:
      - nombre
      - apellido
      - email
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 80
          pattern: \S
          example: Ana
        apellido:
          type: string
          minLength: 1
          maxLength: 80
          pattern: \S
          example: Pérez
        email:
          type: string
          minLength: 1
          maxLength: 120
          pattern: \S
          example: ana.perez@example.com
          format: email
          description: Email válido. Se recortan espacios exteriores y se normaliza a minúsculas antes de comparar
            o persistir (DC-02).
        telefono:
          type: string
          maxLength: 30
          nullable: true
          description: Opcional. Ausente, null o en blanco significa sin teléfono; en PUT elimina el valor anterior
            (DC-03).
          example: +54 11 5555 0101
      x-dto-id: DTO-05
    CrearDireccionRequest:
      type: object
      additionalProperties: false
      description: DTO-06. El id y el usuario propietario se obtienen del servidor y de la ruta. No admite activa,
        usuarioId ni referencia.
      required:
      - calle
      - numero
      - ciudad
      - provincia
      - codigoPostal
      properties:
        calle:
          type: string
          minLength: 1
          maxLength: 100
          pattern: \S
          example: Av. Independencia
        numero:
          type: string
          minLength: 1
          maxLength: 10
          pattern: \S
          example: '1200'
          description: 'Texto, no entero: admite numeración alfanumérica o S/N.'
        piso:
          type: string
          maxLength: 10
          nullable: true
          description: Opcional. Admite PB y otros valores alfanuméricos. En PUT, omitir o enviar null elimina el
            valor anterior.
          example: '2'
        departamento:
          type: string
          maxLength: 10
          nullable: true
          description: Opcional. En PUT, omitir o enviar null elimina el valor anterior.
          example: B
        ciudad:
          type: string
          minLength: 1
          maxLength: 80
          pattern: \S
          example: Ciudad Autónoma de Buenos Aires
        provincia:
          type: string
          minLength: 1
          maxLength: 80
          pattern: \S
          example: Ciudad Autónoma de Buenos Aires
        codigoPostal:
          type: string
          minLength: 1
          maxLength: 10
          pattern: \S
          example: C1099AAZ
        predeterminada:
          type: boolean
          default: false
          example: false
          description: Si true, desmarca la anterior dentro de la misma transacción. Si se omite, false, incluso
            para la primera dirección.
      x-dto-id: DTO-06
    DireccionResponse:
      type: object
      additionalProperties: false
      description: DTO-07. Sólo direcciones activas. No expone activa, la entidad Usuario ni referencias JPA. Piso
        y departamento sin valor se informan como null.
      required:
      - id
      - calle
      - numero
      - piso
      - departamento
      - ciudad
      - provincia
      - codigoPostal
      - predeterminada
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          maximum: 9223372036854775807
          example: 10
          readOnly: true
        calle:
          type: string
          minLength: 1
          maxLength: 100
          pattern: \S
          example: Av. Independencia
        numero:
          type: string
          minLength: 1
          maxLength: 10
          pattern: \S
          example: '1200'
          description: 'Texto, no entero: admite numeración alfanumérica o S/N.'
        piso:
          type: string
          maxLength: 10
          nullable: true
          description: Valor informado; null si no se especificó.
          example: '2'
        departamento:
          type: string
          maxLength: 10
          nullable: true
          description: Valor informado; null si no se especificó.
          example: B
        ciudad:
          type: string
          minLength: 1
          maxLength: 80
          pattern: \S
          example: Ciudad Autónoma de Buenos Aires
        provincia:
          type: string
          minLength: 1
          maxLength: 80
          pattern: \S
          example: Ciudad Autónoma de Buenos Aires
        codigoPostal:
          type: string
          minLength: 1
          maxLength: 10
          pattern: \S
          example: C1099AAZ
        predeterminada:
          type: boolean
          example: false
      x-dto-id: DTO-07
    ModificarDireccionRequest:
      type: object
      additionalProperties: false
      description: DTO-09. PUT reemplaza los datos editables y conserva predeterminada. No admite id, usuarioId,
        activa, predeterminada ni referencia.
      required:
      - calle
      - numero
      - ciudad
      - provincia
      - codigoPostal
      properties:
        calle:
          type: string
          minLength: 1
          maxLength: 100
          pattern: \S
          example: Av. Independencia
        numero:
          type: string
          minLength: 1
          maxLength: 10
          pattern: \S
          example: '1200'
          description: 'Texto, no entero: admite numeración alfanumérica o S/N.'
        piso:
          type: string
          maxLength: 10
          nullable: true
          description: Opcional. Admite PB y otros valores alfanuméricos. En PUT, omitir o enviar null elimina el
            valor anterior.
          example: '2'
        departamento:
          type: string
          maxLength: 10
          nullable: true
          description: Opcional. En PUT, omitir o enviar null elimina el valor anterior.
          example: B
        ciudad:
          type: string
          minLength: 1
          maxLength: 80
          pattern: \S
          example: Ciudad Autónoma de Buenos Aires
        provincia:
          type: string
          minLength: 1
          maxLength: 80
          pattern: \S
          example: Ciudad Autónoma de Buenos Aires
        codigoPostal:
          type: string
          minLength: 1
          maxLength: 10
          pattern: \S
          example: C1099AAZ
      x-dto-id: DTO-09
    Rol:
      type: string
      enum:
      - CLIENTE
      - COMERCIO
      - REPARTIDOR
      - ADMIN
      example: CLIENTE
      description: Un rol por usuario (REL-02). El registro público siempre asigna CLIENTE. Otros roles requieren
        aprovisionamiento controlado; su administración es CU-07, fuera del CORE.
    EstadoUsuario:
      type: string
      enum:
      - ACTIVO
      - INACTIVO
      example: ACTIVO
    ErrorResponse:
      type: object
      additionalProperties: false
      description: DTO-08. Error común de Controller, Service y Security. status coincide con el código HTTP. Nunca
        expone stack traces, SQL, tokens ni contraseñas.
      required:
      - timestamp
      - status
      - code
      - message
      - path
      - correlationId
      properties:
        timestamp:
          type: string
          format: date-time
          description: Fecha ISO-8601 con zona horaria; se usa UTC en los ejemplos (DC-04).
          example: '2026-10-30T15:00:00Z'
        status:
          type: integer
          minimum: 400
          maximum: 599
          example: 400
        code:
          type: string
          enum:
          - VALIDATION_ERROR
          - UNAUTHENTICATED
          - INVALID_CREDENTIALS
          - FORBIDDEN
          - USER_INACTIVE
          - USER_NOT_FOUND
          - ADDRESS_NOT_FOUND
          - EMAIL_ALREADY_REGISTERED
          - INTERNAL_ERROR
          example: VALIDATION_ERROR
        message:
          type: string
          minLength: 1
          pattern: \S
          example: La solicitud contiene datos inválidos
        path:
          type: string
          pattern: ^/api/v1/
          example: /api/v1/auth/register
          description: Ruta concreta solicitada, sin query string, credenciales ni datos internos.
        correlationId:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9._-]+$
          example: g02-demo-001
          description: Reutiliza X-Correlation-Id válido o genera uno nuevo. Coincide con la cabecera de respuesta.
        details:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/DetalleValidacion'
          description: Sólo se incluye en VALIDATION_ERROR. Para errores generales de JSON se usa campo body; no
            incluye valores recibidos ni contraseñas.
      x-dto-id: DTO-08
    DetalleValidacion:
      type: object
      additionalProperties: false
      description: Detalle de validación de un campo (DTO-08). Para ruta o cabecera se usa su nombre; para un JSON
        ilegible, body.
      required:
      - campo
      - mensaje
      properties:
        campo:
          type: string
          minLength: 1
          pattern: \S
          example: email
        mensaje:
          type: string
          minLength: 1
          pattern: \S
          example: Debe tener un formato de email válido
x-jwt-usuario:
  estado: 'Claims sub, role, iat y exp implementados por el backend. Pendiente: firma asimétrica (hoy HS256 con
    clave compartida configurable por JWT_SECRET).'
  claims:
    sub: Identificador Long del usuario convertido a string, estable ante cambios de email.
    role: 'Rol actual: CLIENTE, COMERCIO, REPARTIDOR o ADMIN, sin prefijo ROLE_.'
    iat: NumericDate de emisión, segundos desde Unix epoch.
    exp: NumericDate de vencimiento, segundos desde Unix epoch; corresponde a expiraEn.
  ejemplo-payload:
    sub: '1'
    role: CLIENTE
    iat: 1793372400
    exp: 1793376000
  firma: Objetivo asimétrico; RS256 es una propuesta de implementación, no un acuerdo interequipos confirmado.
