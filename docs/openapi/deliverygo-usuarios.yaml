            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                VALIDATION_ERROR:
                  value:
                    timestamp: '2026-10-30T15:00:00Z'
                    status: 400
                    code: VALIDATION_ERROR
                    message: La solicitud contiene datos inválidos
                    path: /api/v1/users/1/addresses/10/default
                    correlationId: g02-demo-001
                    details:
                    - campo: id
                      mensaje: Debe ser un entero positivo
        '401':
