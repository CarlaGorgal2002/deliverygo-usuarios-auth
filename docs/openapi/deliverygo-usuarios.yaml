  /api/v1/users/{id}/addresses/{addressId}/default:
    patch:
      tags:
      - Direcciones
      summary: Seleccionar dirección predeterminada
      description: |-
        Sólo el titular ACTIVO. No recibe cuerpo: addressId identifica la dirección que se marca como predeterminada.
        Desmarca la anterior y marca la elegida dentro de una única transacción, garantizando RN-07 también ante concurrencia.
        Si ya estaba seleccionada devuelve 200 con la misma dirección; repetir la selección es idempotente.
        Una dirección inexistente, inactiva o ajena produce 404 ADDRESS_NOT_FOUND sin distinguir la causa.
      operationId: seleccionarDireccionPredeterminada
      x-trazabilidad:
        api: API-09
        caso-de-uso: CU-05
        reglas:
        - RN-04
        - RN-05
        - RN-07
        - RN-09
        secuencia: SEC-05
        servicio: SRV-08
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/UsuarioId'
      - $ref: '#/components/parameters/DireccionId'
      responses:
        '200':
          description: 'Seleccionar dirección predeterminada: operación completada.'
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DireccionResponse'
              examples:
